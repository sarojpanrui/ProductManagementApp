<div class="customer-card d-flex justify-content-between align-items-center p-3 mb-3">

  <!-- Left -->
  <div class="d-flex align-items-center gap-3">

    <!-- Avatar -->
    <div class="avatar">
      {{ vendor?.name?.charAt(0).toUpperCase() }}
    </div>

    <!-- Info -->
    <div>
      <div class="fw-semibold fs-6">{{vendor?.name }}</div>
      <small class="text-muted">Vendor</small>
    </div>

  </div>

  <!-- Right -->
  <div class="text-success fw-bold fs-5">
    ₹ {{vendor?.total }}
  </div>

</div>
