<div class="customer-card p-3  shadow-sm rounded">

  <div class="d-flex justify-content-between align-items-start">

    <!-- Left Section -->
    <div class="d-flex align-items-center gap-3">

      <!-- Avatar -->
      <div class="avatar">
        {{ customer?.name?.charAt(0).toUpperCase() }}
      </div>

      

      <!-- Customer Info -->
      <div >

        <div class="fw-bold fs-5">
          {{ customer?.name }}
        </div>

        <small class="text-muted d-block truncate" >
          {{ customer?.email }}
        </small>

        <small class="text-muted d-block">
          {{ customer?.phone }}
        </small>

      </div>

    </div>
  </div>

  <!-- Address -->
  <div class="mt-3">

    <small class="text-muted fw-semibold">
      Address
    </small>

    <div>
      {{ customer?.address }}
    </div>

  </div>

  <!-- Products -->
  <div class="mt-2">

    <small class="text-muted fw-semibold">
      Products
    </small>

    <div class="truncate">
      {{ customer?.products || 'No Products' }}
    </div>

  </div>

  <div class="d-flex gap-2 mt-3">

    <!-- Update Button -->
    <button class="btn btn-outline-primary flex-fill rounded-3 fw-semibold" (click)=" openEdit()">

      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-pencil-icon lucide-pencil">
        <path
          d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
        <path d="m15 5 4 4" />
      </svg>
    </button>

    <!-- Delete Button -->
    <button class="btn btn-outline-danger flex-fill rounded-3 fw-semibold" (click)="delete(customer?.id)">

      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-trash-icon lucide-trash">
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
        <path d="M3 6h18" />
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      </svg>
    </button>

  </div>

</div>



<!-- modal for update -->
 <abp-modal [(visible)]="isOpen">

  <!-- Header -->
  <ng-template #abpHeader>
    <div class="d-flex align-items-center gap-2">
      
      <h4 class="mb-0 fw-bold">
        Update Customer
      </h4>
    </div>
  </ng-template>

  <!-- Body -->
  <ng-template #abpBody>

    <form [formGroup]="form">

      <!-- Name -->
      <div class="mb-3">

        <label class="form-label fw-semibold">
          Customer Name
        </label>

        <input
          type="text"
          class="form-control custom-input"
          placeholder="Enter customer name"
          formControlName="name"
        />

      </div>

      <!-- Address -->
      <div class="mb-3">

        <label class="form-label fw-semibold">
          Address
        </label>

        <textarea
          rows="3"
          class="form-control custom-input"
          placeholder="Enter address"
          formControlName="address"
        ></textarea>

      </div>

      <!-- Phone -->
      <div class="mb-3">

        <label class="form-label fw-semibold">
          Phone Number
        </label>

        <input
          type="text"
          class="form-control custom-input"
          placeholder="Enter phone number"
          formControlName="phone"
        />

      </div>

      <!-- Email -->
      <div class="mb-2">

        <label class="form-label fw-semibold">
          Email Address
        </label>

        <input
          type="email"
          class="form-control custom-input"
          placeholder="Enter email"
          formControlName="email"
        />

      </div>

    </form>

  </ng-template>

  <!-- Footer -->
  <ng-template #abpFooter>

    <div class="d-flex justify-content-end gap-2 w-100">

      <!-- Cancel -->
      <button
        type="button"
        class="btn btn-light border rounded-3 px-4"
        (click)="isOpen = false"
      >
        Cancel
      </button>

      <!-- Update -->
      <button
        type="button"
        class="btn btn-primary rounded-3 px-4"
        [disabled]="form.invalid"
        (click)="update()"
      >
        
        Update
      </button>

    </div>

  </ng-template>

</abp-modal>
