<div class="container py-4">

    <!-- PAGE HEADER -->
    <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">

        <div>
            <h2 class="fw-bold mb-1">
                <i class="fas fa-filter me-2 text-primary"></i>
                Analytics Filters
            </h2>

            <p class="text-muted mb-0">
                Filter bills and customers month wise
            </p>
        </div>

    </div>

    <!-- FILTER SECTION -->
    <div class="row g-4 mb-5">

        <!-- BILL FILTER -->
        <div class="col-12 col-lg-6">

            <div class="card border-0 shadow-sm rounded-4 h-100">

                <div class="card-body">

                    <div class="d-flex align-items-center mb-3">

                        <div class="filter-icon bg-primary-subtle text-primary">
                            <i class="fas fa-file-invoice"></i>
                        </div>

                        <div class="ms-3">
                            <h5 class="mb-0 fw-semibold">
                                Bill Filters
                            </h5>

                            <small class="text-muted">
                                Filter bills by selected month
                            </small>
                        </div>

                    </div>

                    <label class="form-label fw-semibold">
                        Select Month
                    </label>

                    <select class="form-select custom-select" [(ngModel)]="selectedMonth"
                        (change)="filterBillByMonth()">

                        <option value="">
                            All Months
                        </option>

                        <option *ngFor="let month of months" [value]="month.value">
                            {{ month.name }}
                        </option>

                    </select>

                </div>

            </div>

        </div>

        <!-- CUSTOMER FILTER -->
        <div class="col-12 col-lg-6">

            <div class="card border-0 shadow-sm rounded-4 h-100">

                <div class="card-body">

                    <div class="d-flex align-items-center mb-3">

                        <div class="filter-icon bg-success-subtle text-success">
                            <i class="fas fa-users"></i>
                        </div>

                        <div class="ms-3">
                            <h5 class="mb-0 fw-semibold">
                                Customer Filters
                            </h5>

                            <small class="text-muted">
                                Filter customers by selected month
                            </small>
                        </div>

                    </div>

                    <label class="form-label fw-semibold">
                        Select Month
                    </label>

                    <select class="form-select custom-select" [(ngModel)]="selectCustomerMonth"
                        (change)="fetchCustomerByMonth()">

                        <option value="">
                            All Months
                        </option>

                        <option *ngFor="let month of months" [value]="month.value">
                            {{ month.name }}
                        </option>

                    </select>

                </div>

            </div>

        </div>


    </div>

    <!-- BILL SECTION -->
    <div class="mb-5">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
                <h4 class="fw-bold mb-1">
                    <i class="fas fa-receipt me-2 text-primary"></i>
                    Bills
                </h4>
                <p class="text-muted mb-0">
                    Showing {{ filteredBills.length }} bills
                </p>
            </div>
        </div>

        <div class="row g-4">

            <div class="col-12 col-md-6 col-xl-4" *ngFor="let bill of filteredBills">

                <div class="card border-0 shadow-sm rounded-4 h-100 bill-card">

                    <div class="card-body">
                        <app-bill-card [bill]="bill"></app-bill-card>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- CUSTOMER SECTION -->
    <div>
        <div class="d-flex align-items-center justify-content-between mb-3">

            <div>
                <h4 class="fw-bold mb-1">
                    <i class="fas fa-user-friends me-2 text-success"></i>
                    Customers
                </h4>

                <p class="text-muted mb-0">
                    Showing {{ filterCustomers.length }} customers
                </p>
            </div>

        </div>

        <div class="row g-4">

            <div class="col-12 col-md-6 col-xl-4" *ngFor="let c of filterCustomers">
                <div class="card border-0 shadow-sm rounded-4 h-100 customer-card">

                    <div class="card-body">
                        <app-user-card [customer]="c"></app-user-card>
                    </div>

                </div>
            </div>
        </div>

    </div>


</div>
