<nav class="sticky-header bg-white shadow-sm px-3 py-3 mb-3 rounded-4">

    <div class="container-fluid">
        <div class="row align-items-center g-2">

            <div class="col-12 col-md-auto">
                <h4 class="fw-bold text-primary m-0 text-center text-md-start">
                    MyVendors
                </h4>
            </div>



            <div class="col-12 col-md">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">

                        <i class="fas fa-search text-muted"></i>

                    </span>

                    <input type="text" class="form-control border-start-0" placeholder="Search Vendor..."
                        [(ngModel)]="searchText">

                </div>
            </div>

            <div class="col-12 col-md-auto text-end">
                <button class="btn btn-outline-secondary rounded-pill px-3 w-100 w-md-auto" (click)="searchText=  '' ">
                    clear
                </button>
            </div>

        </div>
    </div>

</nav>

<div *ngIf="isLoading" class="text-center my-3">
    <div class="spinner-border text-primary"></div>
</div>

<div class="container mt-3" *ngIf="!isLoading">
    <div class="card-body p-0">
        <div class="customer-scroll row g-3">
            @if(filteredOrders.length > 0){
            @for(ord of filteredOrders; track ord.name) {

            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <app-vendor-card [vendor]="ord"></app-vendor-card>
            </div>

            }
            } @else {
            <div class="text-center text-muted py-4 w-100">
                No customers found
            </div>
            }
        </div>
    </div>
</div>



<!-- pagination part -->
<div class="d-flex justify-content-center align-items-center mt-4 gap-3">
    <button class="btn btn-outline-primary rounded-pill" (click)="prevPage()" [disabled]="pageIndex === 1">
        <span>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-arrow-left-icon lucide-arrow-left">
                <path d="m12 19-7-7 7-7" />
                <path d="M19 12H5" />
            </svg>
            Previous
        </span>
    </button>

    <span class="fw-semibold">
        Page {{ pageIndex }}
    </span>

    <button class="btn btn-outline-primary rounded-pill" (click)="nextPage()"
        [disabled]="pageIndex * pageSize >= totalOrders">
        <span>
            Next
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-arrow-right-icon lucide-arrow-right">
                <path d="M5 12h14" />
                <path d="m12 5 7 7-7 7" />
            </svg>
        </span>
    </button>
</div>
